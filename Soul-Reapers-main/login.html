<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Soul Reapers Esports</title>
    <style>
      :root {
        --bg: #090909;
        --panel: rgba(17, 17, 20, 0.95);
        --panel-soft: #101214;
        --line: rgba(255,255,255,0.08);
        --text: #edf3f7;
        --muted: #a8b0b8;
        --red: #ff2a42;
        --red-bright: #ff4f63;
        --green: #2fe38a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(255,42,66,0.18), transparent 30%), #090909;
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      .auth-shell {
        width: min(460px, calc(100% - 24px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        padding: 28px;
      }
      .brand {
        display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 20px;
      }
      .brand-mark {
        width: 42px; height: 42px; border-radius: 12px; display:grid; place-items:center; background: linear-gradient(135deg, var(--red), #66141f); font-size: 0.8rem;
      }
      h1 { margin: 0 0 10px; font-size: 2rem; }
      p { margin: 0 0 20px; color: var(--muted); }
      form { display: grid; gap: 14px; }
      label { display:grid; gap:8px; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
      input {
        width: 100%; padding: 14px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-soft); color: var(--text);
      }
      button {
        cursor: pointer; border: none; border-radius: 12px; padding: 14px 18px; background: linear-gradient(135deg, var(--red), var(--red-bright)); color: white; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 6px;
      }
      .bottom-text { margin-top: 16px; color: var(--muted); font-size: 0.92rem; text-align: center; }
      .bottom-text a { color: white; }
      .status { min-height: 20px; margin-top: 8px; font-size: 0.9rem; color: #ffb5bf; }
      .status.success { color: #9bf7c6; }
      .remember-row { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:.9rem; }
      .remember-row input { width:auto; accent-color:var(--red); }
      .google-btn { width:100%; margin-top:14px; background:#fff !important; color:#202124 !important; border:1px solid #dadce0 !important; letter-spacing:0 !important; text-transform:none !important; }
      .google-btn:disabled { opacity:.62; cursor:not-allowed; }
      .auth-divider { display:flex; align-items:center; gap:12px; margin:16px 0 0; color:var(--muted); font-size:.8rem; }
      .auth-divider::before, .auth-divider::after { content:""; flex:1; height:1px; background:var(--line); }
      .helper { color:var(--muted); font-size:.85rem; line-height:1.5; }
      [hidden] { display:none !important; }
    </style>
    <link rel="stylesheet" href="theme.css?v=2">
  </head>
  <body>
    <div class="auth-shell">
      <div class="brand"><div class="brand-mark">SRE</div><span>Soul Reapers</span></div>
      <h1>Sign in to Soul Reapers</h1>
      <p id="login-intro">Sign in to your account. After your password, enter the verification code sent to your email.</p>
      <form id="login-form">
        <label>
          Email
          <input id="email" type="email" name="email" placeholder="coach@soulreapers.gg" required />
        </label>
        <label>
          Password
          <input id="password" type="password" name="password" placeholder="••••••••" required />
        </label>
        <label class="remember-row"><input id="remember-me" type="checkbox" /> Remember me on this device</label>
        <button type="submit">Log in</button>
      </form>
      <form id="verification-form" hidden>
        <p class="helper">Enter the 6-digit code sent to your account email. The code expires in 10 minutes.</p>
        <label>Email verification code<input id="verification-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required /></label>
        <button type="submit">Verify and sign in</button>
        <button id="back-to-password" class="google-btn" type="button">Back to password sign-in</button>
      </form>
      <div class="auth-divider"><span>or</span></div>
      <button id="google-sign-in" class="google-btn" type="button">Continue with Google</button>
      <p id="provider-note" class="helper"></p>
      <div id="status" class="status" aria-live="polite"></div>
      <div class="bottom-text">Need an account? <a href="/register">Create one</a></div>
      <div class="bottom-text"><a href="/">Back to home</a> · <a href="/schedule">View schedule</a></div>
    </div>

    <script>
      const form = document.getElementById('login-form');
      const verificationForm = document.getElementById('verification-form');
      const status = document.getElementById('status');
      const googleButton = document.getElementById('google-sign-in');
      const requestedNext = new URLSearchParams(window.location.search).get('next') || '/';
      let googleEnabled = false;

      function getPostLoginDestination(role) {
        try {
          const target = new URL(requestedNext, window.location.origin);
          if (target.origin === window.location.origin && !/^\/(admin|owner|coach)(\/|$)/.test(target.pathname)) {
            return `${target.pathname}${target.search}${target.hash}`;
          }
        } catch (error) {}
        if (role === 'owner') return '/owner';
        if (role === 'admin') return '/admin';
        if (role === 'coach') return '/coach';
        return '/';
      }

      function showEmailVerification() {
        form.hidden = true;
        verificationForm.hidden = false;
        document.getElementById('verification-code').focus();
        status.textContent = 'Check your email for the sign-in code.';
        status.classList.remove('success');
      }

      fetch('/api/auth/providers').then((response) => response.json()).then((providers) => {
        googleEnabled = Boolean(providers.google_enabled && providers.email_verification_enabled);
        if (providers.email_mode === 'console') {
          document.getElementById('login-intro').textContent = 'Local development sign-in: after your password, enter the code printed in the server terminal.';
          document.getElementById('provider-note').textContent = 'Local development mode: the verification code is printed in the server terminal. Do not use this mode in production.';
        }
        if (!googleEnabled) {
          googleButton.disabled = true;
          googleButton.textContent = 'Google sign-in (not configured)';
          if (providers.email_mode !== 'console') {
            document.getElementById('provider-note').textContent = providers.email_verification_enabled
              ? 'Google sign-in is unavailable until the server is configured with Google OAuth credentials.'
              : 'Sign-in is currently unavailable: an owner must configure SMTP email settings for verification codes. Google sign-in also requires Google OAuth credentials.';
          }
        } else if (!providers.email_verification_enabled) {
          document.getElementById('provider-note').textContent = 'Sign-in is currently unavailable: an owner must configure SMTP email settings for verification codes.';
        }
      }).catch(() => {});

      if (new URLSearchParams(window.location.search).get('verify') === 'email') showEmailVerification();

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          remember_me: document.getElementById('remember-me').checked,
        };

        status.textContent = 'Signing in...';
        status.classList.remove('success');

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            credentials: 'same-origin',
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || 'Login failed');
          if (result.verification_required) {
            showEmailVerification();
          } else if (result.user && result.user.role) {
            status.textContent = 'Signed in. Redirecting...';
            status.classList.add('success');
            window.location.href = getPostLoginDestination(result.user.role);
          } else {
            status.textContent = 'Login failed. Please try again.';
          }
        } catch (error) {
          status.textContent = error.message;
        }
      });

      verificationForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        status.textContent = 'Verifying code...';
        status.classList.remove('success');
        try {
          const response = await fetch('/api/auth/verify-email', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: document.getElementById('verification-code').value.trim() }),
            credentials: 'same-origin',
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || 'Verification failed');
          status.textContent = 'Verified. Redirecting...';
          status.classList.add('success');
          window.location.href = getPostLoginDestination(result.user.role);
        } catch (error) { status.textContent = error.message; }
      });

      document.getElementById('back-to-password').addEventListener('click', async () => {
        await fetch('/api/auth/cancel-email-verification', { method: 'POST', credentials: 'same-origin' });
        verificationForm.hidden = true;
        form.hidden = false;
        status.textContent = '';
      });

      googleButton.addEventListener('click', () => {
        if (!googleEnabled) return;
        const remember = document.getElementById('remember-me').checked ? '?remember_me=true' : '';
        window.location.href = `/auth/google/login${remember}`;
      });
    </script>
  </body>
</html>
